[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fylix-cli"
version = "1.0.0"
description = "FYLIX - Secure file transfer with blockchain verification"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "httpx>=0.25.0",
    "websockets>=12.0",
    "rich>=13.0.0",
]

[project.scripts]
fylix = "fylix.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["fylix*"]
